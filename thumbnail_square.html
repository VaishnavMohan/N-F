<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Square Thumbnail - Mohammed Nadeer &amp; Fathima Rinsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Great+Vibes&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1A3827 0%, #0F2016 65%, #050B08 100%);
      font-family: 'Cinzel', serif;
      color: #FAF7F2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      text-align: center;
    }

    .card-border {
      position: absolute;
      inset: 12px;
      border: 2px solid #2B523B;
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(229, 197, 120, 0.35);
      pointer-events: none;
    }

    .card-border::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(229, 197, 120, 0.3);
      border-radius: 18px;
    }

    /* Royal Double-Gold Monogram Emblem (No Photo) */
    .monogram-emblem {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #E5C578;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 197, 120, 0.35);
      margin-bottom: 16px;
      background: #FAF8F5;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .monogram-emblem::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1.5px solid #C5A059;
      pointer-events: none;
    }

    .monogram-text {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #1A1A1A;
    }

    .bismillah-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #E5C578;
      margin-bottom: 6px;
      z-index: 2;
    }

    .invite-lead {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #A8C2B3;
      text-transform: uppercase;
      margin-bottom: 8px;
      z-index: 2;
    }

    .couple-names-wrap {
      z-index: 2;
      margin-bottom: 12px;
    }

    .groom-text, .bride-text {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      line-height: 1.15;
    }

    .and-text {
      font-family: 'Great Vibes', cursive;
      font-size: 30px;
      color: #E5C578;
      line-height: 0.95;
      margin: 2px 0;
    }

    .date-pill {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(229, 197, 120, 0.14);
      border: 1px solid rgba(229, 197, 120, 0.4);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #FFF0C2;
      text-transform: uppercase;
      margin-bottom: 8px;
      z-index: 2;
    }

    .venue-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: #E8E1D3;
      z-index: 2;
    }

    .time-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #E5C578;
      margin-top: 4px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card-border"></div>

  <!-- Royal N/R Monogram (No Photo) -->
  <div class="monogram-emblem">
    <div class="monogram-text">N/R</div>
  </div>

  <div class="bismillah-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="invite-lead">Wedding Invitation</div>

  <div class="couple-names-wrap">
    <div class="groom-text">MOHAMMED NADEER</div>
    <div class="and-text">and</div>
    <div class="bride-text">FATHIMA RINSI</div>
  </div>

  <div class="date-pill">Saturday, 31 October 2026</div>
  <div class="venue-text">CN Auditorium Kumbidi</div>
  <div class="time-text">4:00 PM TO 8:30 PM</div>
</body>
</html>
