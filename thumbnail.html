<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Thumbnail Preview - Mohammed Nadeer &amp; Fathima Rinsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(circle at 60% 40%, #173322 0%, #0D1C13 55%, #050B08 100%);
      font-family: 'Cinzel', serif;
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* Ambient Glow */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(229, 197, 120, 0.22) 0%, rgba(30, 62, 43, 0.25) 45%, transparent 70%);
      pointer-events: none;
    }

    /* Card Frame */
    .card-container {
      width: 100%;
      height: 100%;
      border: 2px solid #2B523B;
      border-radius: 28px;
      background: rgba(14, 28, 20, 0.88);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(229, 197, 120, 0.35);
      display: flex;
      align-items: center;
      padding: 36px 48px;
      gap: 48px;
      position: relative;
      overflow: hidden;
    }

    .card-container::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(229, 197, 120, 0.3);
      border-radius: 20px;
      pointer-events: none;
    }

    /* Left Royal Card Showcase (No Photo) */
    .card-crest-showcase {
      width: 380px;
      height: 480px;
      border-radius: 20px;
      border: 2px solid #D4AF37;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(229, 197, 120, 0.3);
      flex-shrink: 0;
      position: relative;
      background: #FAF8F5;
      color: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .card-crest-showcase::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1.5px solid #C5A059;
      border-radius: 12px;
      pointer-events: none;
    }

    .crest-monogram {
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #1A1A1A;
      margin-bottom: 8px;
    }

    .crest-together {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #333333;
      margin-bottom: 22px;
    }

    .crest-date-block {
      border-top: 1px solid #C5A059;
      border-bottom: 1px solid #C5A059;
      padding: 10px 18px;
      margin: 12px 0;
    }

    .crest-date-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #1A1A1A;
      text-transform: uppercase;
    }

    .crest-hijri {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #555555;
      margin-top: 8px;
    }

    /* Right Details Content */
    .details-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .bismillah-text {
      font-size: 20px;
      font-weight: 700;
      color: #E5C578;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }

    .invite-tag {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #A8C2B3;
      margin-bottom: 6px;
    }

    .groom-name {
      font-size: 38px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
      line-height: 1.1;
    }

    .and-script {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: #E5C578;
      line-height: 1;
      margin: 2px 0;
    }

    .bride-name {
      font-size: 38px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .date-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 22px;
      background: rgba(229, 197, 120, 0.14);
      border: 1px solid rgba(229, 197, 120, 0.4);
      border-radius: 9999px;
      margin-bottom: 14px;
      width: fit-content;
    }

    .date-text {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #FFF0C2;
      text-transform: uppercase;
    }

    .venue-block {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      color: #E8E1D3;
      line-height: 1.35;
    }

    .timing-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #E5C578;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card-container">
    
    <!-- Left Royal Inset Invitation Card -->
    <div class="card-crest-showcase">
      <div class="crest-monogram">N/R</div>
      <div class="crest-together">Together With<br>Their Families</div>
      <div class="crest-date-block">
        <div class="crest-date-text">31 OCTOBER 2026</div>
      </div>
      <div class="crest-hijri">{ 20 JUMADA AL-AWWAL 1448 AH }</div>
    </div>

    <!-- Wedding Details -->
    <div class="details-content">
      <div class="bismillah-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div class="invite-tag">Wedding Invitation</div>
      
      <div class="groom-name">MOHAMMED NADEER</div>
      <div class="and-script">and</div>
      <div class="bride-name">FATHIMA RINSI</div>
      
      <div class="date-box">
        <span>📅</span>
        <span class="date-text">Saturday, 31 October 2026</span>
      </div>

      <div class="venue-block">
        CN Auditorium Kumbidi
      </div>

      <div class="timing-tag">
        <span>⏰</span>
        <span>4:00 PM TO 8:30 PM</span>
        <span>•</span>
        <span>Kumbidi, Kerala</span>
      </div>
    </div>

  </div>
</body>
</html>
